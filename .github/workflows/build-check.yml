name: build-check

on:
  pull_request:
    branches: [nx2]
  push:
    branches: [nx2]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a pull request's run; nx2 runs finish so each merge saves its compiler cache.
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect source changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      build: ${{ steps.files.outputs.build }}
    steps:
      - name: Skip builds for documentation-only pull requests
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          build=true
          if [ -n "$PR" ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            if ! printf '%s\n' "$files" | grep -qvE '^(docs/.*|.*\.md)$'; then
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  linux-gcc:
    name: Linux NX2 versus upstream homebrew pixels
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: 88eba1e5c436ce996bfaaabb8ca950891653da3b

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf gcc-13 g++-13 git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache pipx \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          pipx install cmake==4.4.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      # Objects are keyed by content, so the newest cache of this branch or nx2 always helps;
      # keying it on cpmfile.json threw the whole cache away whenever a dependency changed.
      - name: Restore dependencies and compiler objects
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cache/cpm
            .ccache
          key: gcc13-qt683-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gcc13-qt683-${{ runner.os }}-

      - name: Configure production and tests
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DENABLE_WERROR=ON \
            -DBUILD_TESTING=ON \
            -DYUZU_TESTS=ON \
            -DENABLE_QT=ON \
            -DENABLE_QT_TRANSLATION=ON \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON

      - name: Build production and tests
        run: |
          ccache --zero-stats
          cmake --build build --target yuzu-cmd --parallel "$(nproc)"
          ccache --show-stats

      # Everything above builds the pinned PR #4 source. No previously passed CTest rerun.
      - name: Check out existing pixel oracle
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: astraea-emu/nx2-lab
          ref: 800b1a524b6a3d72d0d450f9e0e53f5122f55611
          path: nx2-lab-graphics
          persist-credentials: false

      - name: Check out public-domain graphics source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: switchbrew/switch-examples
          ref: 669786898205b7beb25ff1731e72982e6d0397d3
          path: switch-examples
          persist-credentials: false

      - name: Build one shared homebrew input
        run: |
          test "$(git rev-parse HEAD)" = 88eba1e5c436ce996bfaaabb8ca950891653da3b
          test "$(git -C switch-examples rev-parse HEAD)" = 669786898205b7beb25ff1731e72982e6d0397d3
          docker pull devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE/switch-examples:/source" \
            -w /source/graphics/deko3d/deko_basic \
            devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282 make -j2
          test -s switch-examples/graphics/deko3d/deko_basic/deko_basic.nro
          test -x build/bin/eden-cli

      - name: Obtain checksum-verified upstream build-160
        run: |
          curl -fL --retry 2 --max-time 240 \
            -o "$RUNNER_TEMP/lichii.tar.gz" \
            https://github.com/zortos293/Lichii/releases/download/build-160/lichii-linux-x86_64.tar.gz
          echo "8808893f08062c9a450234a3988eb2291dcda9d686a4d7e8780c0b6b6ec21962  $RUNNER_TEMP/lichii.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/upstream-package"
          tar -xzf "$RUNNER_TEMP/lichii.tar.gz" -C "$RUNNER_TEMP/upstream-package"
          test -x "$RUNNER_TEMP/upstream-package/lichii/eden-cli"

      - name: Compare two isolated software-Vulkan presentations
        timeout-minutes: 5
        run: |
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb xauth python3-pil
          icds=(/usr/share/vulkan/icd.d/lvp*.json)
          test "${#icds[@]}" -eq 1
          test -f "${icds[0]}"
          for label in upstream nx2; do
            base="$RUNNER_TEMP/$label"
            mkdir -p "$base/home"/{config,data,cache,runtime}
            chmod 700 "$base/home/runtime"
            printf '[Renderer]\nbackend=1\nbackend\\default=false\n[Audio]\noutput_engine=3\noutput_engine\\default=false\n' > "$base/runtime.ini"
            if [ "$label" = upstream ]; then
              binary="$RUNNER_TEMP/upstream-package/lichii/eden-cli"
            else
              binary="$GITHUB_WORKSPACE/build/bin/eden-cli"
            fi
            (
              export HOME="$base/home" XDG_CONFIG_HOME="$base/home/config"
              export XDG_DATA_HOME="$base/home/data" XDG_CACHE_HOME="$base/home/cache"
              export XDG_RUNTIME_DIR="$base/home/runtime"
              export VK_DRIVER_FILES="${icds[0]}" SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy
              export EDEN_NX2_FRAME_DUMP="$base/frame-dump" EDEN_NX2_FRAME_DUMP_AT=1f
              set +e
              timeout --signal=TERM --kill-after=3s 18s \
                xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' \
                "$binary" --config "$base/runtime.ini" \
                --game "$GITHUB_WORKSPACE/switch-examples/graphics/deko3d/deko_basic/deko_basic.nro" \
                > "$base/console.log" 2>&1
              printf '%s\n' "$?" > "$base/exit.txt"
            )
          done

      - name: Verify both pixels and compare exact RGB
        run: |
          for label in upstream nx2; do
            python3 nx2-lab-graphics/tools/reference/homebrew/verify_deko_basic.py \
              "$RUNNER_TEMP/$label/frame-dump" > "$RUNNER_TEMP/$label/pixels.json"
          done
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from PIL import Image

          root = Path(os.environ["RUNNER_TEMP"])
          results = {}
          for label in ("upstream", "nx2"):
              directory = root / label
              report = json.loads((directory / "pixels.json").read_text())
              captures = sorted((directory / "frame-dump").glob("*_present_*.png"))
              with Image.open(captures[0]) as image:
                  rgb_hash = hashlib.sha256(image.tobytes()).hexdigest()
              results[label] = {
                  "process_exit": int((directory / "exit.txt").read_text()),
                  "present_captures": report["captured_present_images"],
                  "all_pixels_match_oracle": True,
                  "frames_identical": report["all_present_frames_identical"],
                  "raw_rgb_sha256": rgb_hash,
              }

          result = {
              "scope": "Switch 1 public-domain deko3d (not Switch 2 games)",
              "nx2_source": "88eba1e5c436ce996bfaaabb8ca950891653da3b",
              "upstream_source": "2eb5f081c8734affd272466f89133aa4e3e56e18",
              "homebrew_source": "669786898205b7beb25ff1731e72982e6d0397d3",
              "homebrew_nro_sha256": hashlib.sha256(
                  (Path(os.environ["GITHUB_WORKSPACE"]) /
                   "switch-examples/graphics/deko3d/deko_basic/deko_basic.nro").read_bytes()
              ).hexdigest(),
              "engines": results,
              "cross_engine_rgb_equal": (
                  results["upstream"]["raw_rgb_sha256"] ==
                  results["nx2"]["raw_rgb_sha256"]
              ),
          }
          (root / "deko-compare.json").write_text(json.dumps(result, indent=2) + "\n")
          print(json.dumps(result, sort_keys=True))
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("### Switch 1 deko3d: exact source-built NX2 vs upstream\n\n")
              f.write("~~~json\n" + json.dumps(result, indent=2) + "\n~~~\n")
              f.write("All-pixel RGB oracle only. Does not establish normal exit, input, audio or Switch 2 game compatibility.\n")
          if not (result["cross_engine_rgb_equal"] and all(
                  r["process_exit"] == 124 and r["present_captures"] >= 1 and
                  r["frames_identical"] for r in results.values())):
              raise SystemExit("Public homebrew pixel comparison failed")
          PY

      - name: Preserve only public input and captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nx2-vs-lichii-deko-basic
          path: |
            ${{ runner.temp }}/deko-compare.json
            ${{ runner.temp }}/upstream/frame-dump/*_present_*.png
            ${{ runner.temp }}/nx2/frame-dump/*_present_*.png
          if-no-files-found: warn
          retention-days: 2

      - name: Save dependencies and compiler objects
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cache/cpm
            .ccache
          key: gcc13-qt683-${{ runner.os }}-${{ github.sha }}

  windows-clang-cl:
    name: Windows clang-cl production build and tests
    needs: changes
    if: needs.changes.outputs.build == 'true' && github.head_ref != 'integration/loader-shutdown-ci'
    runs-on: windows-2022
    timeout-minutes: 120
    # ccache rather than sccache: sccache has no direct mode for clang-cl, so every hit still ran the
    # preprocessor and a 99% hit build took 8.5 minutes.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      # The release job's compiler; ThinLTO is left to the release build to keep this job short.
      - name: Install LLVM
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install ccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-windows-x86_64.zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne '6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84') {
              throw 'ccache checksum mismatch'
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'ccache-4.14.2-windows-x86_64' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      # Restore and save separately so a test failure still keeps the compiled objects.
      - name: Restore dependencies and compiler objects
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cache/cpm
            .ccache
          key: clang-cl-ccache-qt683-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            clang-cl-ccache-qt683-${{ runner.os }}-

      - name: Configure production and tests
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe"
          "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe"
          "-DCMAKE_C_FLAGS=-DWIN32 -D_WINDOWS -DNOMINMAX"
          "-DCMAKE_CXX_FLAGS=-DWIN32 -D_WINDOWS -EHsc -DNOMINMAX"
          -DENABLE_WERROR=ON
          -DBUILD_TESTING=ON
          -DYUZU_TESTS=ON
          -DENABLE_QT=ON
          -DENABLE_QT_TRANSLATION=ON
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=ON
          -DUSE_DISCORD_PRESENCE=OFF
          -DUSE_CCACHE=ON

      # The install script pins clang-cl by checksum, so it identifies the compiler without hashing
      # the binary on every call.
      - name: Build production and tests
        env:
          CCACHE_COMPILERCHECK: string:${{ hashFiles('tools/windows/install-llvm.ps1') }}
        run: |
          ccache --zero-stats
          cmake --build build --parallel
          ccache --show-stats -v

      # nxformat is linked statically: lichii.exe must not need an nxformat.dll, which Windows
      # may refuse to load (Smart App Control, code integrity policies) or that may be missing.
      - name: Check lichii.exe does not import nxformat.dll
        run: |
          imports=$("$LLVM_ROOT/bin/llvm-readobj" --coff-imports build/bin/lichii.exe |
            awk '/^(Import|DelayImport) {/ { kind = $1 } /^  Name:/ { print kind, $2 }')
          echo "$imports"
          if grep -qi ' nxformat.dll$' <<< "$imports"; then
            echo "::error::lichii.exe imports nxformat.dll; nxformat must be linked statically"
            exit 1
          fi

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error --parallel "$NUMBER_OF_PROCESSORS"

      - name: Save dependencies and compiler objects
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cache/cpm
            .ccache
          key: clang-cl-ccache-qt683-${{ runner.os }}-${{ github.sha }}
