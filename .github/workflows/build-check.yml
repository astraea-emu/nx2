name: build-check

on:
  pull_request:
    branches: [nx2]
  push:
    branches: [nx2]
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels a pull request's run; nx2 runs finish so each merge saves its compiler cache.
concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect source changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      build: ${{ steps.files.outputs.build }}
    steps:
      - name: Skip builds for documentation-only pull requests
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          build=true
          if [ -n "$PR" ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            if ! printf '%s\n' "$files" | grep -qvE '^(docs/.*|.*\.md)$'; then
              build=false
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  linux-gcc:
    name: Linux NX2 actual homebrew gameplay
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: 88eba1e5c436ce996bfaaabb8ca950891653da3b

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf gcc-13 g++-13 git glslang-tools libglu1-mesa-dev \
            libpulse-dev libtool libudev-dev libxkbcommon-x11-0 \
            mesa-common-dev nasm ninja-build qt6-base-private-dev \
            qt6-charts-dev qt6-tools-dev libavfilter-dev libavcodec-dev \
            libswscale-dev pkg-config zlib1g-dev libva-dev libvdpau-dev \
            spirv-tools spirv-headers libusb-1.0-0-dev \
            libboost-dev libboost-fiber-dev libboost-context-dev \
            libopus-dev libasound2-dev ccache pipx \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          pipx install cmake==4.4.4
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtcharts
          cache: true

      # Objects are keyed by content, so the newest cache of this branch or nx2 always helps;
      # keying it on cpmfile.json threw the whole cache away whenever a dependency changed.
      - name: Restore dependencies and compiler objects
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cache/cpm
            .ccache
          key: gcc13-qt683-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gcc13-qt683-${{ runner.os }}-

      - name: Configure production and tests
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DENABLE_WERROR=ON \
            -DBUILD_TESTING=ON \
            -DYUZU_TESTS=ON \
            -DENABLE_QT=ON \
            -DENABLE_QT_TRANSLATION=ON \
            -DYUZU_CMD=ON \
            -DYUZU_ROOM=OFF \
            -DYUZU_ROOM_STANDALONE=OFF \
            -DYUZU_USE_BUNDLED_QT=OFF \
            "-DCMAKE_PREFIX_PATH=$QT_ROOT_DIR" \
            -DYUZU_USE_BUNDLED_SDL3=ON \
            -DVulkanHeaders_FORCE_BUNDLED=ON \
            -DVulkanUtilityLibraries_FORCE_BUNDLED=ON \
            -DENABLE_UPDATE_CHECKER=ON \
            -DUSE_DISCORD_PRESENCE=OFF \
            -DUSE_CCACHE=ON

      - name: Build production and tests
        run: |
          ccache --zero-stats
          cmake --build build --target yuzu-cmd --parallel "$(nproc)"
          ccache --show-stats

      # Everything above builds the pinned PR #4 source. No previously passed CTest rerun.
      - name: Check out MIT-licensed Space Game NX source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: vgmoose/space-nx
          ref: d09ff27498a0baa2d4ab085ef3b4e3a9bc2fa75c
          path: space-game
          persist-credentials: false

      - name: Build original SDL2 homebrew game
        run: |
          test "$(git -C space-game rev-parse HEAD)" = d09ff27498a0baa2d4ab085ef3b4e3a9bc2fa75c
          docker pull devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
          docker run --rm --network none \
            -e DEVKITPRO=/opt/devkitpro -e DEVKITA64=/opt/devkitpro/devkitA64 \
            -v "$GITHUB_WORKSPACE/space-game:/source" -w /source \
            devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282 \
            make -f Makefile.libnx -j2 \
              'CFLAGS=-g -O2 -fpermissive -fcommon $(INCLUDE) -DSWITCH -D__LIBNX__ -DNOSTYLUS' \
              'LIBS=-lSDL2 -lEGL -lglapi -ldrm_nouveau -lnx -lm -lstdc++'
          test -s space-game/spacenx.nro
          test -x build/bin/eden-cli

      - name: Run source-built NX2 game menu to gameplay
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb xauth python3-pil imagemagick
          icds=(/usr/share/vulkan/icd.d/lvp*.json)
          test "${#icds[@]}" -eq 1
          mkdir -p "$RUNNER_TEMP/home"/{config,data,cache,runtime}
          chmod 700 "$RUNNER_TEMP/home/runtime"
          printf '[Renderer]\nbackend=1\nbackend\\default=false\n[Audio]\noutput_engine=3\noutput_engine\\default=false\n' > "$RUNNER_TEMP/runtime.ini"
          export HOME="$RUNNER_TEMP/home" XDG_CONFIG_HOME="$RUNNER_TEMP/home/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/home/data" XDG_CACHE_HOME="$RUNNER_TEMP/home/cache"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/home/runtime"
          export VK_DRIVER_FILES="${icds[0]}" SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy
          # SDL scancode A (4) maps to emulated controller A; the game uses it at "Start Game".
          export EDEN_NX2_KEY_SCRIPT="3:4,3.5:-4"
          export EDEN_NX2_FRAME_DUMP="$RUNNER_TEMP/frame-dump" EDEN_NX2_FRAME_DUMP_AT=1f
          set +e
          xvfb-run -a -s '-screen 0 1920x1080x24 -nolisten tcp' \
            bash -c '
              timeout --signal=TERM --kill-after=3s 15s "$@" &
              child=$!
              sleep 8
              import -window root "$RUNNER_TEMP/desktop.png" || true
              wait "$child"
            ' bash "$GITHUB_WORKSPACE/build/bin/eden-cli" \
            --config "$RUNNER_TEMP/runtime.ini" \
            --game "$GITHUB_WORKSPACE/space-game/spacenx.nro" \
            > "$RUNNER_TEMP/console.log" 2>&1
          printf '%s\n' "$?" > "$RUNNER_TEMP/exit.txt"
          exit 0

      - name: Inspect first completed game frame (no correctness claim)
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from PIL import Image

          root = Path(os.environ["RUNNER_TEMP"])
          images = sorted((root / "frame-dump").glob("*_present_*.png"))
          captures = []
          for image_file in images[:4]:
              with Image.open(image_file) as png:
                  rgb = png.convert("RGB")
                  color_counts = rgb.getcolors(maxcolors=2048)
                  captures.append({
                      "resolution": list(rgb.size),
                      "sha256": hashlib.sha256(image_file.read_bytes()).hexdigest(),
                      "unique_rgb_colors": len(color_counts) if color_counts is not None else ">2048",
                  })
          desktop_file = root / "desktop.png"
          desktop = None
          if desktop_file.is_file():
              with Image.open(desktop_file) as screenshot:
                  rgb = screenshot.convert("RGB")
                  nonblack = sum(any(channel > 8 for channel in pixel) for pixel in rgb.getdata())
                  desktop = {
                      "resolution": list(rgb.size),
                      "nonblack_fraction": round(nonblack / (rgb.width * rgb.height), 6),
                      "sha256": hashlib.sha256(desktop_file.read_bytes()).hexdigest(),
                  }
          with (root / "console.log").open("rb") as stream:
              log = stream.read(4 * 1024 * 1024 + 1)
          startup_flags = {
              "sdl_init_failed": b"SDL init failed" in log,
              "window_create_failed": b"window could not be created" in log,
              "guest_program_log_seen": b"initialized SDL" in log,
              "renderer_frame_dump_armed": b"Frame dump armed" in log,
              "frontend_a_press_logged": b"Key script: press key 4" in log,
          }
          report = {
              "scope": "MIT-licensed Switch 1 SDL2 space game; source-built NX2 only",
              "input_attempt": "one emulated A press at 3.0 s, released at 3.5 s; gameplay not assumed",
              "desktop": desktop,
              "startup_flags": startup_flags,
              "log_bounded": len(log) <= 4 * 1024 * 1024,
              "game_source_sha": "d09ff27498a0baa2d4ab085ef3b4e3a9bc2fa75c",
              "nx2_sha": "88eba1e5c436ce996bfaaabb8ca950891653da3b",
              "nro_sha256": hashlib.sha256(
                  (Path(os.environ["GITHUB_WORKSPACE"]) / "space-game/spacenx.nro").read_bytes()
              ).hexdigest(),
              "process_exit": int((root / "exit.txt").read_text().strip()),
              "present_images": captures,
              "pixel_correctness_verified": False,
              "input_verified": False,
          }
          print(json.dumps(report, sort_keys=True))
          (root / "space-game-summary.json").write_text(json.dumps(report, indent=2) + "\n")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as out:
              out.write("### Space Game NX — source-built NX2 gameplay\n\n")
              out.write("~~~json\n" + json.dumps(report, indent=2) + "\n~~~\n")
              out.write("Presence of a capture is not proof of correct gameplay, input or Switch 2 compatibility.\n")
          print("GAME_FRAME_STATUS=" + ("vulkan_capture" if captures else "not_captured"))
          # A desktop image or Vulkan dump alone does not establish game correctness.
          PY

      - name: Preserve only public-domain frame images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-game-nx2-gameplay
          path: |
            ${{ runner.temp }}/space-game-summary.json
            ${{ runner.temp }}/frame-dump/*_present_*.png
            ${{ runner.temp }}/desktop.png
          if-no-files-found: warn
          retention-days: 2

      - name: Save dependencies and compiler objects
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cache/cpm
            .ccache
          key: gcc13-qt683-${{ runner.os }}-${{ github.sha }}

  windows-clang-cl:
    name: Windows clang-cl production build and tests
    needs: changes
    if: needs.changes.outputs.build == 'true' && github.head_ref != 'experiment/deko-plus-guest-exit'
    runs-on: windows-2022
    timeout-minutes: 120
    # ccache rather than sccache: sccache has no direct mode for clang-cl, so every hit still ran the
    # preprocessor and a 99% hit build took 8.5 minutes.
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 1G
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756

      # The release job's compiler; ThinLTO is left to the release build to keep this job short.
      - name: Install LLVM
        shell: pwsh
        run: ./tools/windows/install-llvm.ps1

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true

      - name: Install ccache
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          Invoke-WebRequest -OutFile $zip https://github.com/ccache/ccache/releases/download/v4.14.2/ccache-4.14.2-windows-x86_64.zip
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne '6993ce645e53192cec592ee23186200b574ac4c59097ecde8d9cfd681b47ae84') {
              throw 'ccache checksum mismatch'
          }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'ccache-4.14.2-windows-x86_64' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Vulkan SDK
        shell: pwsh
        run: ./tools/windows/install-vulkan-sdk.ps1

      # Restore and save separately so a test failure still keeps the compiled objects.
      - name: Restore dependencies and compiler objects
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cache/cpm
            .ccache
          key: clang-cl-ccache-qt683-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            clang-cl-ccache-qt683-${{ runner.os }}-

      - name: Configure production and tests
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_C_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_CXX_COMPILER=$LLVM_ROOT/bin/clang-cl.exe"
          "-DCMAKE_LINKER=$LLVM_ROOT/bin/lld-link.exe"
          "-DCMAKE_AR=$LLVM_ROOT/bin/llvm-lib.exe"
          "-DCMAKE_C_FLAGS=-DWIN32 -D_WINDOWS -DNOMINMAX"
          "-DCMAKE_CXX_FLAGS=-DWIN32 -D_WINDOWS -EHsc -DNOMINMAX"
          -DENABLE_WERROR=ON
          -DBUILD_TESTING=ON
          -DYUZU_TESTS=ON
          -DENABLE_QT=ON
          -DENABLE_QT_TRANSLATION=ON
          -DYUZU_CMD=ON
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DYUZU_USE_BUNDLED_QT=OFF
          -DYUZU_USE_BUNDLED_SDL3=ON
          -DENABLE_UPDATE_CHECKER=ON
          -DUSE_DISCORD_PRESENCE=OFF
          -DUSE_CCACHE=ON

      # The install script pins clang-cl by checksum, so it identifies the compiler without hashing
      # the binary on every call.
      - name: Build production and tests
        env:
          CCACHE_COMPILERCHECK: string:${{ hashFiles('tools/windows/install-llvm.ps1') }}
        run: |
          ccache --zero-stats
          cmake --build build --parallel
          ccache --show-stats -v

      # nxformat is linked statically: lichii.exe must not need an nxformat.dll, which Windows
      # may refuse to load (Smart App Control, code integrity policies) or that may be missing.
      - name: Check lichii.exe does not import nxformat.dll
        run: |
          imports=$("$LLVM_ROOT/bin/llvm-readobj" --coff-imports build/bin/lichii.exe |
            awk '/^(Import|DelayImport) {/ { kind = $1 } /^  Name:/ { print kind, $2 }')
          echo "$imports"
          if grep -qi ' nxformat.dll$' <<< "$imports"; then
            echo "::error::lichii.exe imports nxformat.dll; nxformat must be linked statically"
            exit 1
          fi

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --no-tests=error --parallel "$NUMBER_OF_PROCESSORS"

      - name: Save dependencies and compiler objects
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .cache/cpm
            .ccache
          key: clang-cl-ccache-qt683-${{ runner.os }}-${{ github.sha }}
